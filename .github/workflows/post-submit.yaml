name: Publish Container Images
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  push_to_registry:
    name: Build and push unversioned images to quay.io/medik8s
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
          registry: quay.io

      - name: Build and push development CSV with latest images
        # Main builds must not replace release tags or reuse the release CSV identity.
        run: >-
          make container-build-and-push IMAGE_REGISTRY=quay.io/medik8s
          VERSION=0.0.1 IMAGE_TAG=latest PREVIOUS_VERSION= SKIP_RANGE_LOWER=
